[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-trading-lab"
version = "0.1.0"
description = "Reproducible systematic trading research infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
trading-lab = "systematic_trading_lab.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
