name: Bug report
description: Report a reproducible problem in Systematic Trading Lab
title: "[bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Do not include API keys, private account data, or sensitive broker responses. Security vulnerabilities should be reported privately according to SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps, commands, or fixture inputs that reproduces the problem.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Git commit, tag, or installed version where you observed the problem.
  - type: input
    id: platform
    attributes:
      label: Environment
      description: Operating system, Python version, and relevant tool versions.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Sanitized logs or other context. Remove credentials and private account/broker data.