name: Documentation issue
description: Report unclear, stale, or missing documentation
title: "[docs] "
labels: []
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: File, section, command, or page that needs attention.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, stale, incorrect, or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional wording or structure that would make the documentation clearer.